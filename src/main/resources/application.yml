server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seckill_demo?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&preserveInstants=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: seckill-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

seckill:
  payment-timeout-seconds: 1800
  creating-lease-seconds: 60
  reconcile-grace-seconds: 60
  reservation-retention-seconds: 604800

  scheduler:
    fixed-delay-ms: 3000
    batch-size: 100
    outbox-max-retry: 10
    compensation-max-retry: 20
    retry-base-seconds: 5
    sending-timeout-seconds: 120

  mq:
    create-order-topic: seckill-create-order
    close-order-topic: seckill-close-order
    release-stock-topic: seckill-release-stock
    create-order-consumer-group: seckill-create-order-group
    close-order-consumer-group: seckill-close-order-group
    release-stock-consumer-group: seckill-release-stock-group
